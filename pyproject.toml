[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "robosense-lab"
version = "0.1.0"
description = "Pipeline experimental de percepção para RoboCup Junior Soccer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.2,<3", "opencv-python-headless>=4.11,<5", "pyserial>=3.5,<4"]

[project.optional-dependencies]
pi-servos = ["pigpio>=1.78,<2"]

[project.scripts]
robosense-lab = "robosense_lab.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
