name: Python portability

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.11"
          - os: ubuntu-24.04-arm
            python: "3.11"
          - os: windows-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . --only-binary=numpy,opencv-python-headless
      - run: python -m unittest discover -s tests -v
      - run: python -m robosense_lab.sectors --frames 6 --serial-port loop:// --output runs/ci-sectors.jsonl
